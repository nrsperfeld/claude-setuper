<!doctype html>
<html><head><meta charset="utf-8"><style>
/* O ícone do app: o anel aberto com a luz do outro lado. ?mini=1 engrossa o anel e tira o brilho, pros tamanhos pequenos. */
*{margin:0;box-sizing:border-box}
html,body{width:1024px;height:1024px;background:transparent;overflow:hidden}
.icone{--s:824px;position:absolute;left:100px;top:100px;width:var(--s);height:var(--s);border-radius:22.4%;background:linear-gradient(165deg,#24242F,#09090E 72%);overflow:hidden;box-shadow:inset 0 0 0 2px rgba(255,255,255,.09)}
.icone i{position:absolute;display:block;border-radius:50%}
.luz{inset:12%;background:radial-gradient(circle,#FFEBC6 0,rgba(242,166,90,.72) 26%,rgba(184,100,46,.26) 50%,transparent 70%)}
.anel{inset:17%;--e:calc(var(--s)*.052);background:conic-gradient(from 70deg,#5A479F 0,#B8642E 120deg,#F2A65A 230deg,#FFF1D6 310deg,transparent 310deg);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - var(--e)),#000 calc(100% - var(--e) + 1px));mask:radial-gradient(farthest-side,transparent calc(100% - var(--e)),#000 calc(100% - var(--e) + 1px))}
.ponto{left:66.6%;top:24%;width:9.4%;height:9.4%;background:#FFF1D6;box-shadow:0 0 calc(var(--s)*.06) rgba(255,241,214,.8)}
.mini .luz{display:none}.mini .anel{--e:calc(var(--s)*.12);inset:14%}
</style></head><body><div class="icone" id="i"><i class="luz"></i><i class="anel"></i><i class="ponto"></i></div>
<script>if(location.search.includes('mini'))document.getElementById('i').classList.add('mini')</script></body></html>
